name: Shared Timeline Audio

on:
  pull_request:
    paths:
      - 'modules/shared-timeline-audio/**'
      - 'tools/package-shared-timeline-audio.py'
      - '.github/workflows/shared-timeline-audio.yml'
  push:
    branches: [master]
    paths:
      - 'modules/shared-timeline-audio/**'
      - 'tools/package-shared-timeline-audio.py'
      - '.github/workflows/shared-timeline-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test transport and simulated Foundry clients
        run: npm --prefix modules/shared-timeline-audio test
      - name: Validate and package standalone module
        run: python3 tools/package-shared-timeline-audio.py
      - uses: actions/upload-artifact@v4
        with:
          name: shared-timeline-audio
          path: dist/shared-timeline-audio-*.zip
          if-no-files-found: error
          retention-days: 30
