name: WFRP4e Fan Tools
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python3 tools/package-module.py
      - uses: actions/upload-artifact@v4
        with:
          name: wfrp4e-fan-tools
          path: dist/wfrp4e-fan-tools-*.zip
          if-no-files-found: error
